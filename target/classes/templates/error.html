<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Error - Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex;
               justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; border-radius: 8px; padding: 40px; text-align: center;
                box-shadow: 0 2px 16px rgba(0,0,0,0.12); max-width: 420px; }
        h1 { color: #dc3545; font-size: 22px; margin-bottom: 12px; }
        p  { color: #555; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
        a  { color: #003087; }
    </style>
</head>
<body>
<div class="card">
    <h1>⚠️ Simulator Error</h1>
    <p>Could not process the request.<br/>
       This usually means the QS parameter could not be decrypted,<br/>
       or the checksum validation failed.</p>
    <p>Please check the simulator logs for details.</p>
    <p><a href="/control">Go to Control Panel</a></p>
</div>
</body>
</html>
