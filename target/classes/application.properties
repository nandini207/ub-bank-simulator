# Server port
# Keep this aligned with the frontend Vite proxy default so the React app can talk
# to the backend without CORS or hardcoded port drift.
server.port=8383

# UAT Encryption Key - AES-256 (from PDF page 5)
simulator.encryption.key=q4UOLnbuVc0mP8Jf634f1zCGVy2pf9lj

# UAT Checksum Key - SHA-512 HMAC (from PDF page 5)
simulator.checksum.key=union@123

# Show DEBUG logs for our package only
logging.level.com.billdesk=INFO
logging.level.root=WARN

# Force UTF-8 console output so special characters render correctly
# (some Windows consoles drop lines with non-ASCII characters)
logging.charset.console=UTF-8
logging.charset.file=UTF-8
spring.output.ansi.enabled=NEVER